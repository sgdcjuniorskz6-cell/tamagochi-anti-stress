<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тамагочи-антистресс</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Твой питомец</h1>
    <div class="pet-card">
      <span class="pet" id="pet">🐣</span>
    </div>
    <div class="mood-bar">
      <div class="mood-fill" id="mood-fill"></div>
    </div>
    <p class="hint">Кликни на питомца, чтобы порадовать его</p>
    <div class="food-menu">
      <button class="food-btn" data-food="🍎">🍎</button>
      <button class="food-btn" data-food="🍕">🍕</button>
      <button class="food-btn" data-food="🍰">🍰</button>
      <button class="food-btn" data-food="🍩">🍩</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
