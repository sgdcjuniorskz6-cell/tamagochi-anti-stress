<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тамагочи-антистресс</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Твой питомец</h1>
    <div class="pet-card pet-card--float">
      <span class="pet" id="pet">🐣</span>
    </div>
    <div class="mood-bar">
      <div class="mood-fill" id="mood-fill"></div>
    </div>
    <div class="needs-bars">
      <div class="need-group">
        <span class="need-label">Голод</span>
        <div class="need-bar hunger-bar">
          <div class="need-fill hunger-fill" id="hunger-fill"></div>
        </div>
      </div>
      <div class="need-group">
        <span class="need-label">Сон</span>
        <div class="need-bar sleep-bar">
          <div class="need-fill sleep-fill" id="sleep-fill"></div>
        </div>
      </div>
    </div>
    <p class="hint">Кликни на питомца, чтобы порадовать его</p>
    <div class="food-menu">
      <button class="food-btn" data-food="🍎">🍎</button>
      <button class="food-btn" data-food="🍕">🍕</button>
      <button class="food-btn" data-food="🍰">🍰</button>
      <button class="food-btn" data-food="🍩">🍩</button>
    </div>
    <div class="sleep-timer" id="sleep-timer"></div>
    <div class="games-section">
      <div class="games-menu">
        <button class="game-btn" data-game="bubbles" title="Пузырьки">🫧</button>
        <button class="game-btn" data-game="math" title="Математика">🔢</button>
        <button class="game-btn" data-game="catch" title="Поймай еду">🍎</button>
      </div>
      <div class="game-arena" id="game-arena"></div>
    </div>
    <button class="play-btn" id="play-btn">⚽ Бросить мяч</button>
    <div class="ball" id="ball">⚽</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
