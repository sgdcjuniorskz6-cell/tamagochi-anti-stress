<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тамагочи-антистресс</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container page-enter">
    <div class="top-bar">
      <button class="icon-btn" id="theme-btn" title="Тема">🌙</button>
      <button class="icon-btn" id="stats-btn" title="Статистика">📊</button>
      <button class="icon-btn" id="achv-btn" title="Достижения">🏆<span class="achievement-badge" id="achv-badge" hidden></span></button>
      <button class="icon-btn" id="shop-btn" title="Аксессуары">🎀</button>
      <button class="icon-btn" id="reset-btn" title="Сбросить игру">🔄</button>
    </div>
    <h1 class="title">Твой питомец</h1>
    <div class="coins" id="coins">🪙 15</div>
  <div class="pet-card pet-card--float" id="pet-card">
    <span class="pet" id="pet">🐣</span>
    <span class="accessory" id="accessory" hidden></span>
  </div>
    <div class="pet-select" id="pet-select">
      <button class="pet-option" data-pet="🐣">🐣</button>
      <button class="pet-option" data-pet="🐱">🐱</button>
      <button class="pet-option" data-pet="🐶">🐶</button>
      <button class="pet-option" data-pet="🐰">🐰</button>
      <button class="pet-option" data-pet="🐼">🐼</button>
    </div>
    <div class="mood-bar">
      <div class="mood-fill" id="mood-fill"></div>
    </div>
    <div class="needs-bars">
      <div class="need-group">
        <span class="need-label">Голод</span>
        <div class="need-bar hunger-bar">
          <div class="need-fill hunger-fill" id="hunger-fill"></div>
        </div>
      </div>
      <div class="need-group">
        <span class="need-label">Сон</span>
        <div class="need-bar sleep-bar">
          <div class="need-fill sleep-fill" id="sleep-fill"></div>
        </div>
      </div>
    </div>
    <p class="hint">Кликни на питомца, чтобы порадовать его</p>
    <div class="food-menu">
      <button class="food-btn" data-food="🍎" data-price="5">🍎<span class="food-price">🪙5</span></button>
      <button class="food-btn" data-food="🍕" data-price="8">🍕<span class="food-price">🪙8</span></button>
      <button class="food-btn" data-food="🍰" data-price="12">🍰<span class="food-price">🪙12</span></button>
      <button class="food-btn" data-food="🍩" data-price="6">🍩<span class="food-price">🪙6</span></button>
    </div>
    <div class="sleep-timer" id="sleep-timer"></div>
    <div class="games-section">
      <div class="games-menu">
        <button class="game-btn" data-game="bubbles" title="Пузырьки">🫧</button>
        <button class="game-btn" data-game="math" title="Математика">🔢</button>
        <button class="game-btn" data-game="catch" title="Поймай еду">🍎</button>
        <button class="game-btn" data-game="snake" title="Змейка">🐍</button>
        <button class="game-btn" data-game="pong" title="Пинг-понг">🏓</button>
      </div>
      <div class="game-arena" id="game-arena"></div>
    </div>
    <div class="action-row">
      <button class="play-btn" id="play-btn">⚽ Бросить мяч</button>
      <button class="walk-btn" id="walk-btn">🚶 Прогуляться</button>
    </div>
    <div class="ball" id="ball">⚽</div>
  </div>
  <div class="stats-panel" id="stats-panel">
    <div class="stats-content">
      <button class="game-close" id="stats-close">✕</button>
      <h2 class="stats-title">Статистика</h2>
      <div class="stat-row"><span>Клики</span><span id="stat-clicks">0</span></div>
      <div class="stat-row"><span>Кормлений</span><span id="stat-feeds">0</span></div>
      <div class="stat-row"><span>Поглаживаний</span><span id="stat-pets">0</span></div>
      <div class="stat-row"><span>Игр в мяч</span><span id="stat-plays">0</span></div>
      <div class="stat-row"><span>Мини-игр сыграно</span><span id="stat-games">0</span></div>
      <div class="stat-row"><span>Пробуждений от сна</span><span id="stat-sleeps">0</span></div>
      <div class="stat-row"><span>Прогулок</span><span id="stat-walks">0</span></div>
    </div>
  </div>
  <div class="stats-panel" id="shop-panel">
    <div class="stats-content">
      <button class="game-close" id="shop-close">✕</button>
      <h2 class="stats-title">Аксессуары</h2>
      <p class="shop-balance" id="shop-balance">🪙 15</p>
      <div class="shop-list" id="shop-list"></div>
    </div>
  </div>
  <div class="stats-panel" id="achv-panel">
    <div class="stats-content">
      <button class="game-close" id="achv-close">✕</button>
      <h2 class="stats-title">Достижения</h2>
      <div class="achievement-list" id="achv-list"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
